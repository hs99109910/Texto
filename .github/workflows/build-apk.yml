name: Build APK

on:
  push:
    branches: [ main, claude/app-build-h2us3g, claude/app-ui-changes-dwxibd ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew assembleFossDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Texto-sms-debug
          # archivesName in app/build.gradle.kts renames the output to
          # Texto-sms-<versionCode>-foss-debug.apk, so match by glob instead
          # of hardcoding a name that drifts with every version bump.
          path: app/build/outputs/apk/foss/debug/*.apk
